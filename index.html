/* ============================================================
   FREEZERS ESPORT — cryo design system
   Light blue · white · violet on deep ice
   ============================================================ */

:root {
  --fz-bg: #050b18;
  --fz-bg-2: #081426;
  --fz-panel: rgba(13, 27, 51, 0.66);
  --fz-panel-solid: #0b1930;
  --fz-ice: #7dd3fc;
  --fz-ice-bright: #bae6fd;
  --fz-ice-pale: #e8f7ff;
  --fz-violet: #8b5cf6;
  --fz-violet-soft: #a78bfa;
  --fz-violet-pale: #ddd6fe;
  --fz-text: #f2f9ff;
  --fz-muted: rgba(226, 242, 255, 0.66);
  --fz-muted-2: rgba(226, 242, 255, 0.4);
  --fz-line: rgba(125, 211, 252, 0.22);
  --fz-line-violet: rgba(167, 139, 250, 0.3);
  --fz-ink: #04101f;
  --fz-glass: rgba(125, 211, 252, 0.06);
  --fz-glass-border: rgba(186, 230, 253, 0.18);
}

.fz-root {
  background: linear-gradient(180deg, #071223 0%, #050b18 40%, #0a0f24 75%, #0d0a1f 100%);
  color: var(--fz-text);
  font-family: 'Outfit', 'Space Grotesk', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* abstract cryo fog layers */
.fz-root::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 12% 8%, rgba(125, 211, 252, 0.09), transparent 60%),
    radial-gradient(ellipse 50% 45% at 88% 30%, rgba(139, 92, 246, 0.07), transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 85%, rgba(125, 211, 252, 0.06), transparent 65%);
  animation: fz-fog-drift 26s ease-in-out infinite alternate;
}
@keyframes fz-fog-drift {
  from { transform: translate3d(0, 0, 0) scale(1); opacity: 0.9; }
  50% { transform: translate3d(-2.5%, 1.5%, 0) scale(1.06); opacity: 1; }
  to { transform: translate3d(2%, -1.5%, 0) scale(1.02); opacity: 0.85; }
}

.fz-root ::selection {
  background: var(--fz-ice);
  color: var(--fz-ink);
}

.fz-root a {
  color: inherit;
  text-decoration: none;
}

.fz-mono {
  font-family: 'JetBrains Mono', monospace;
}

.fz-display {
  font-family: 'Sora', sans-serif;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 0.98;
  text-transform: uppercase;
}

.fz-wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 32px;
}
@media (max-width: 640px) {
  .fz-wrap { padding: 0 20px; }
}

/* ---------- particle canvas ---------- */
.fz-ice-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ---------- collab banner ---------- */
.fz-collab-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;
  padding: 16px 20px;
  background: linear-gradient(90deg, #c4b5fd, #e9d5ff 50%, #bae6fd);
  border: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  font-family: 'Sora', sans-serif;
  z-index: 2;
  color: var(--fz-ink);
}
.fz-collab-banner::after {
  content: '';
  position: absolute;
  top: 0;
  left: -60%;
  width: 40%;
  height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  animation: fz-banner-sheen 4.5s ease-in-out infinite;
}
@keyframes fz-banner-sheen {
  0% { left: -60%; }
  60%, 100% { left: 120%; }
}
.fz-collab-banner:hover { filter: brightness(1.06); }
.fz-collab-banner-mark {
  font-size: 24px;
  color: var(--fz-ink);
  line-height: 1;
  flex-shrink: 0;
  animation: fz-collab-spin 3.2s linear infinite;
}
@keyframes fz-collab-spin {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.25); }
  100% { transform: rotate(360deg) scale(1); }
}
.fz-collab-banner-text {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-align: center;
}
.fz-collab-banner-text > span:first-child {
  font-size: clamp(18px, 3.4vw, 28px);
  font-weight: 800;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  line-height: 1;
}
.fz-collab-banner-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
@media (max-width: 640px) {
  .fz-collab-banner { gap: 10px; padding: 12px; }
  .fz-collab-banner-mark { font-size: 16px; }
}

/* ---------- header (glass) ---------- */
.fz-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(5, 11, 24, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--fz-line);
  transition: box-shadow 0.3s ease;
}
.fz-header.scrolled {
  box-shadow: 0 8px 30px rgba(3, 8, 18, 0.55), 0 1px 0 rgba(125, 211, 252, 0.25);
}
.fz-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
}
.fz-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.fz-brand img {
  height: 38px;
  width: auto;
  filter: drop-shadow(0 0 12px rgba(125, 211, 252, 0.35));
}
.fz-brand-name {
  font-family: 'Sora', sans-serif;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  line-height: 1;
  display: flex;
  flex-direction: column;
}

  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fz-ice);
  margin-top: 5px;
}
.fz-nav {
  display: flex;

  position: relative;
  padding: 9px 12px;

}
