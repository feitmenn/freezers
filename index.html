<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freezers Esports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#070a12;
    --bg-1:#0c1220;
    --bg-2:#111a2e;
    --turquoise:#2fe0c9;
    --turquoise-dim:#1a9e8f;
    --violet:#9a5cff;
    --violet-dim:#6a3fd6;
    --pink:#ff5fb0;
    --ice:#eef6fb;
    --ice-dim:#aab8cc;
    --line:rgba(238,246,251,0.09);
    --card:rgba(255,255,255,0.035);
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg-0);
    color:var(--ice);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  h1,h2,h3,h4,.display{
    font-family:'Chakra Petch',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

  /* ambient bloom blobs */
  .bloom{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:0.55;}
  .bloom-a{width:560px;height:560px;background:var(--turquoise);top:-180px;left:-160px;}
  .bloom-b{width:620px;height:620px;background:var(--violet);top:40vh;right:-220px;opacity:0.4;}
  .bloom-c{width:480px;height:480px;background:var(--pink);bottom:-160px;left:20vw;opacity:0.3;}

  /* NAV */
  header.nav{
    position:sticky;top:0;z-index:50;
    background:rgba(7,10,18,0.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;max-width:1180px;margin:0 auto;}
  .nav-brand{display:flex;align-items:center;gap:10px;}
  .nav-brand img{height:30px;width:auto;}
  .nav-brand span{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:17px;letter-spacing:0.03em;}
  nav.links{display:flex;gap:28px;align-items:center;}
  nav.links a{font-size:14px;color:var(--ice-dim);transition:color .2s;}
  nav.links a:hover{color:var(--turquoise);}
  .nav-legal{display:flex;align-items:center;gap:6px;margin-left:6px;padding-left:16px;border-left:1px solid var(--line);}
  .nav-legal a{font-size:10px;color:rgba(170,184,204,0.55);letter-spacing:.03em;transition:color .2s;}
  .nav-legal a:hover{color:var(--turquoise);}
  .nav-legal-sep{font-size:10px;color:rgba(170,184,204,0.3);}
  .nav-cta{
    font-size:13px;font-weight:600;padding:9px 18px;
    background:linear-gradient(120deg,var(--turquoise),var(--violet));
    color:#080b14;border-radius:2px;letter-spacing:.02em;
    transition:filter .2s, transform .2s;
  }
  .nav-cta:hover{filter:brightness(1.12);transform:translateY(-1px);}
  .nav-toggle{display:none;background:none;border:none;color:var(--ice);font-size:22px;cursor:pointer;}

  /* HERO */
  .hero{
    position:relative;
    min-height:92vh;
    display:flex;align-items:center;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero-bg{
    position:absolute;inset:0;
    background-image:linear-gradient(180deg, rgba(7,10,18,0.35) 0%, rgba(7,10,18,0.55) 45%, var(--bg-0) 100%), url('images/ice.jpg');
    background-size:cover;background-position:center 30%;
    filter:saturate(0.85);
  }
  .hero-content{position:relative;z-index:2;width:100%;text-align:center;padding:100px 28px 70px;}
  .hero-logo-wrap{position:relative;display:inline-block;margin-bottom:6px;}
  .hero-logo{width:150px;height:auto;position:relative;z-index:2;filter:drop-shadow(0 0 30px rgba(47,224,201,0.45));}
  .hero-logo-glow{
    position:absolute;inset:0;
    background-image:url('images/logo.png');
    background-size:contain;background-repeat:no-repeat;background-position:center;
    width:150px;height:150px;left:50%;top:0;transform:translateX(-50%);
    filter:blur(28px) saturate(1.6);opacity:0.85;z-index:1;
  }
  .hero-name-wrap{position:relative;margin:22px auto 14px;display:inline-block;}
  .hero-name{
    position:relative;z-index:2;
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;
    font-size:clamp(46px,9vw,96px);
    letter-spacing:0.02em;
    line-height:1;
    background:linear-gradient(100deg,var(--turquoise) 8%, var(--violet) 55%, var(--pink) 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-name-blur{
    position:absolute;inset:0;z-index:1;
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;
    font-size:clamp(46px,9vw,96px);
    letter-spacing:0.02em;line-height:1;
    background:linear-gradient(100deg,var(--turquoise) 8%, var(--violet) 55%, var(--pink) 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:blur(22px);opacity:0.8;
  }
  .hero-tag{
    color:var(--ice-dim);font-size:15px;letter-spacing:0.04em;margin-top:10px;
    font-family:'Chakra Petch',sans-serif;
  }
  .hero-achievement{
    display:inline-flex;align-items:center;gap:10px;
    margin-top:30px;padding:10px 20px 10px 14px;
    border:1px solid rgba(154,92,255,0.4);
    background:rgba(154,92,255,0.08);
    border-radius:3px;
    font-size:14px;
    transition:background .2s, border-color .2s, transform .2s;
  }
  .hero-achievement:hover{background:rgba(154,92,255,0.16);border-color:var(--violet);transform:translateY(-1px);}
  .hero-achievement .medal{font-size:18px;}
  .hero-achievement .arrow{opacity:0.6;transition:transform .2s;}
  .hero-achievement:hover .arrow{transform:translateX(3px);opacity:1;}
  .hero-scroll{
    position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:0.15em;color:var(--ice-dim);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    z-index:2;
  }
  .hero-scroll .line{width:1px;height:34px;background:linear-gradient(var(--turquoise),transparent);}

  /* SECTION HEADERS */
  .section{padding:110px 0;position:relative;}
  .section-head{margin-bottom:52px;max-width:640px;}
  .section-kicker{
    font-size:13px;color:var(--turquoise);font-family:'Chakra Petch',sans-serif;
    margin-bottom:10px;letter-spacing:0.03em;
  }
  .section-title{font-size:clamp(28px,4vw,40px);}
  .section-sub{color:var(--ice-dim);margin-top:14px;font-size:15px;max-width:560px;}

  /* SCRIM SERVER BANNER */
  .scrim-banner{
    position:relative;
    background:linear-gradient(100deg, rgba(255,95,176,0.1), rgba(154,92,255,0.08));
    border-top:1px solid rgba(255,95,176,0.35);
    border-bottom:1px solid rgba(255,95,176,0.35);
    padding:24px 0;
  }
  .scrim-close-btn{
    position:absolute;top:14px;right:20px;background:none;border:none;
    color:var(--ice-dim);font-size:16px;cursor:pointer;opacity:0.6;transition:opacity .2s;
  }
  .scrim-close-btn:hover{opacity:1;color:var(--ice);}
  .scrim-banner-inner{
    max-width:1180px;margin:0 auto;padding:0 44px 0 28px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .scrim-live-dot{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;
    color:var(--pink);font-family:'Chakra Petch',sans-serif;font-weight:600;margin-bottom:6px;
  }
  .scrim-live-dot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);animation:pulse 2s infinite;}
  .scrim-matchup{font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:600;}
  .scrim-note{font-size:13px;color:var(--ice-dim);margin-top:4px;}
  .scrim-connect{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .scrim-ip-box{
    background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:2px;
    padding:10px 16px;font-family:'Chakra Petch',sans-serif;font-size:15px;letter-spacing:.02em;
  }
  .scrim-copy-btn{
    background:linear-gradient(120deg,var(--turquoise),var(--pink));
    color:#080b14;border:none;padding:10px 18px;border-radius:2px;
    font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    transition:filter .2s;
  }
  .scrim-copy-btn:hover{filter:brightness(1.1);}
  @media (max-width:700px){
    .scrim-banner-inner{flex-direction:column;align-items:flex-start;}
  }

  /* HUB */
  .hub{
    display:grid;
    grid-template-columns:260px 1fr 260px;
    gap:24px;
    align-items:start;
  }
  .hub-side{display:flex;flex-direction:column;gap:18px;}
  .hub-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:20px;
    transition:border-color .2s, transform .2s, background .2s;
  }
  .hub-card:hover{border-color:rgba(47,224,201,0.4);transform:translateY(-2px);background:rgba(255,255,255,0.05);}
  .hub-card .hc-label{font-size:11px;letter-spacing:.08em;color:var(--turquoise);font-family:'Chakra Petch',sans-serif;margin-bottom:8px;}
  .hub-card .hc-title{font-family:'Chakra Petch',sans-serif;font-size:17px;font-weight:600;margin-bottom:6px;}
  .hub-card .hc-desc{font-size:13px;color:var(--ice-dim);}
  .hub-card.accent{border-color:rgba(255,95,176,0.35);}
  .hub-card.accent .hc-label{color:var(--pink);}

  .hub-center{
    background:linear-gradient(180deg, rgba(154,92,255,0.06), rgba(47,224,201,0.04));
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px;
    position:relative;
  }
  .hub-center-inner{
    background:var(--bg-1);
    border-radius:2px;
    padding:26px;
    min-height:520px;
  }
  .hub-center-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .hub-center-head h3{font-size:19px;}
  .live-dot{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--turquoise);letter-spacing:.06em;font-family:'Chakra Petch',sans-serif;}
  .live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--turquoise);box-shadow:0 0 8px var(--turquoise);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .news-item{padding:18px 0;border-bottom:1px solid var(--line);}
  .news-date{font-size:11px;color:var(--turquoise);letter-spacing:.06em;font-family:'Chakra Petch',sans-serif;margin-bottom:6px;}
  .news-title{font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;margin-bottom:6px;}
  .news-text{font-size:13.5px;color:var(--ice-dim);}

  /* ROSTER */
  .team-block{margin-bottom:56px;}
  .team-head{
    display:flex;align-items:center;gap:14px;margin-bottom:22px;
    padding-bottom:14px;border-bottom:1px solid var(--line);
  }
  .team-tier{font-size:11px;letter-spacing:.1em;color:var(--turquoise);font-family:'Chakra Petch',sans-serif;}
  .team-name{font-family:'Chakra Petch',sans-serif;font-size:22px;font-weight:600;}
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .player-card{
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    padding:16px 18px;transition:border-color .2s, transform .2s;position:relative;overflow:hidden;
  }
  .player-card:hover{border-color:rgba(47,224,201,0.4);transform:translateY(-2px);}
  .player-card.captain{border-color:rgba(255,95,176,0.4);}
  .player-card.empty{opacity:0.35;font-style:italic;}
  .player-name{font-family:'Chakra Petch',sans-serif;font-size:17px;font-weight:600;margin-bottom:4px;}
  .player-role{font-size:12px;color:var(--ice-dim);}
  .player-card.captain .player-role{color:var(--pink);}
  .player-social{display:flex;gap:8px;margin-top:12px;}
  .player-social a{width:22px;height:22px;opacity:0.7;transition:opacity .2s;}
  .player-social a:hover{opacity:1;}

  /* STAFF */
  .staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
  .staff-card{
    background:var(--card);border:1px solid var(--line);border-radius:3px;padding:24px;
    transition:border-color .2s, transform .2s;
  }
  .staff-card:hover{border-color:rgba(154,92,255,0.4);transform:translateY(-2px);}
  .staff-role{font-size:11px;letter-spacing:.08em;color:var(--turquoise);font-family:'Chakra Petch',sans-serif;margin-bottom:10px;}
  .staff-name{font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:600;margin-bottom:10px;}
  .staff-discord{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ice-dim);
    border:1px solid var(--line);padding:6px 10px;border-radius:2px;
  }
  .staff-discord .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);}

  /* KALENDÁŘ */
  .table-wrap{overflow-x:auto;}
  .attendance-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .attendance-table th, .attendance-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);}
  .attendance-table th{font-size:11px;letter-spacing:.06em;color:var(--ice-dim);font-family:'Chakra Petch',sans-serif;text-transform:uppercase;}

  /* FORM */
  .survey-wrap{
    background:var(--card);border:1px solid var(--line);border-radius:3px;padding:34px;
    max-width:680px;
  }
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:12.5px;color:var(--ice-dim);font-family:'Chakra Petch',sans-serif;margin-bottom:8px;letter-spacing:.02em;}
  .field input, .field textarea, .field select{
    width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--line);
    border-radius:2px;padding:11px 14px;color:var(--ice);font-family:'Inter',sans-serif;font-size:14px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--turquoise);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:600px){ .field-row{grid-template-columns:1fr;} }
  .radio-group{display:flex;gap:10px;flex-wrap:wrap;}
  .radio-pill{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ice-dim);
    border:1px solid var(--line);padding:9px 14px;border-radius:2px;cursor:pointer;transition:all .2s;
  }
  .radio-pill:hover{border-color:rgba(47,224,201,0.4);}
  .radio-pill input{accent-color:#2fe0c9;}
  .submit-btn{
    background:linear-gradient(120deg,var(--turquoise),var(--violet));
    color:#080b14;border:none;padding:13px 30px;border-radius:2px;
    font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
    transition:filter .2s, transform .2s;letter-spacing:.02em;
  }
  .submit-btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  /* FOOTER */
  footer{border-top:1px solid var(--line);padding:56px 0 40px;margin-top:40px;}
  .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .footer-brand{display:flex;align-items:center;gap:12px;}
  .footer-brand img{height:26px;width:auto;}
  .footer-brand span{font-size:12.5px;color:var(--ice-dim);}
  .footer-links{display:flex;gap:22px;flex-wrap:wrap;}
  .footer-links a{font-size:12.5px;color:var(--ice-dim);transition:color .2s;}
  .footer-links a:hover{color:var(--turquoise);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:rgba(4,6,12,0.85);padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--bg-1);border:1px solid var(--line);border-radius:4px;
    padding:34px;max-width:420px;width:100%;position:relative;
    max-height:90vh;overflow-y:auto;
  }
  .modal-kicker{font-size:11px;letter-spacing:.08em;color:var(--turquoise);font-family:'Chakra Petch',sans-serif;margin-bottom:10px;}
  .modal-card h3{font-size:22px;margin-bottom:20px;}
  .modal-close{
    position:absolute;top:16px;right:16px;background:none;border:none;
    color:var(--ice-dim);font-size:16px;cursor:pointer;
  }
  .modal-close:hover{color:var(--turquoise);}

  /* NOTIFIKACE */
  .notification-stack{position:fixed;top:20px;right:20px;z-index:210;display:flex;flex-direction:column;gap:10px;}
  .notification-toast{
    background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--turquoise);
    border-radius:3px;padding:14px 18px;font-size:13px;max-width:320px;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
  }
  .notification-toast.rejected{border-left-color:var(--pink);}

  /* COOKIE */
  .cookie-banner{
    position:fixed;left:0;right:0;bottom:0;z-index:300;
    display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;
    background:rgba(7,10,18,0.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:16px 24px;
    transform:translateY(0);transition:transform .3s ease;
  }
  .cookie-banner.hidden{transform:translateY(120%);}
  .cookie-text{font-size:12.5px;color:var(--ice-dim);max-width:680px;}
  .cookie-text a{color:var(--turquoise);text-decoration:underline;}
  .cookie-accept-btn{
    background:linear-gradient(120deg,var(--turquoise),var(--violet));
    color:#080b14;border:none;padding:10px 24px;border-radius:2px;
    font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    transition:filter .2s;white-space:nowrap;
  }
  .cookie-accept-btn:hover{filter:brightness(1.1);}

  /* ANTHEM TOGGLE */
  .anthem-toggle{
    position:fixed;right:20px;bottom:20px;z-index:120;
    width:44px;height:44px;border-radius:50%;
    background:rgba(12,18,32,0.9);border:1px solid var(--line);
    color:var(--ice);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .2s, transform .2s;
  }
  .anthem-toggle:hover{border-color:rgba(47,224,201,0.5);transform:scale(1.06);}
  .anthem-toggle.playing{border-color:var(--turquoise);box-shadow:0 0 14px rgba(47,224,201,0.35);}

  /* ADMIN PANEL */
  .admin-panel{
    position:fixed;inset:0;z-index:400;display:none;
    background:rgba(4,6,12,0.92);backdrop-filter:blur(6px);
  }
  .admin-panel.show{display:block;}
  .admin-panel-inner{
    position:absolute;inset:0;background:var(--bg-0);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .admin-panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 26px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .admin-panel-head h2{font-size:19px;}
  .admin-panel-head .ap-actions{display:flex;gap:12px;align-items:center;}
  .admin-panel-layout{display:flex;height:100%;overflow:hidden;}
  .admin-sidebar{
    width:220px;flex-shrink:0;border-right:1px solid var(--line);
    padding:18px 12px;overflow-y:auto;
    display:flex;flex-direction:column;gap:2px;
    background:rgba(255,255,255,0.015);
  }
  .admin-tab-btn{
    display:flex;align-items:center;gap:10px;
    background:none;border:none;text-align:left;
    padding:11px 12px;border-radius:3px;cursor:pointer;
    color:var(--ice-dim);font-family:'Chakra Petch',sans-serif;font-size:13px;letter-spacing:.02em;
    transition:background .2s, color .2s;
  }
  .admin-tab-btn:hover{background:rgba(255,255,255,0.04);color:var(--ice);}
  .admin-tab-btn.active{background:rgba(47,224,201,0.1);color:var(--turquoise);}
  .admin-tab-btn .att-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
  .admin-content{flex:1;overflow-y:auto;padding:30px 40px 60px;min-width:0;}
  .admin-tab-panel{display:none;max-width:640px;}

    .admin-tab-btn{flex-shrink:0;white-space:nowrap;}
    .admin-content{padding:20px;}
  }

    color:var(--ice-dim);font-size:16px;cursor:pointer;
